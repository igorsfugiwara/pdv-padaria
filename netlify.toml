[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Config web do Firebase: pública por natureza (vai no bundle); a proteção são as regras do Firestore
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_STORAGE_BUCKET,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_APP_ID"

# SPA: todas as rotas (/cortico/cardapio, /cortico/admin…) caem no index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
